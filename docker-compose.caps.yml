# Caps-only overlay (no privileged). Try:
#   docker compose -f docker-compose.yml -f docker-compose.caps.yml up -d
# Fallback if netns/tun fails: drop -f docker-compose.caps.yml (uses privileged: true).
services:
  warp-pool:
    privileged: false
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
