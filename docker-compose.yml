# warp-pool production compose
# Dual network:
#   - default: compose bridge (host port publish 19080/19090/19100+)
#   - cpa_default: shared with chen-fork/cpa → DNS name warp-pool:1080
#
# VPS:
#   mkdir -p /opt/warp-pool && cp docker-compose.yml .env /opt/warp-pool/
#   # ensure volume exists (once): docker volume create warp-pool-data
#   cd /opt/warp-pool && docker compose pull && docker compose up -d
#
# Update later: docker compose pull && docker compose up -d

services:
  warp-pool:
    image: ${WARP_POOL_IMAGE:-ghcr.io/mcheiyue/warp-pool:latest}
    container_name: warp-pool
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
    environment:
      WARP_INSTANCES: "${WARP_INSTANCES:-2}"
      INSTANCE_PORT_BASE: "${INSTANCE_PORT_BASE:-40000}"
      EXPOSE_PORT_BASE: "${EXPOSE_PORT_BASE:-11000}"
      ENABLE_EXPOSE: "${ENABLE_EXPOSE:-0}"
      PARK_ON_UNPOOL: "${PARK_ON_UNPOOL:-1}"
      AGG_SOCKS_PORT: "${AGG_SOCKS_PORT:-1080}"
      CONTROL_PORT: "${CONTROL_PORT:-9090}"
      CONTROL_BIND: "${CONTROL_BIND:-0.0.0.0}"
      CONTROL_TOKEN: "${CONTROL_TOKEN:?set CONTROL_TOKEN in .env}"
      HEALTH_INTERVAL: "${HEALTH_INTERVAL:-90}"
      HEALTH_TIMEOUT: "${HEALTH_TIMEOUT:-15}"
      HEALTH_FAILURES: "${HEALTH_FAILURES:-3}"
      ROTATE_COOLDOWN: "${ROTATE_COOLDOWN:-300}"
      ROTATE_MODE: "${ROTATE_MODE:-hard}"
      REGISTER_STAGGER: "${REGISTER_STAGGER:-5}"
      REGISTER_JITTER_MAX: "${REGISTER_JITTER_MAX:-8}"
      PARTIAL_REGISTER_POLICY: "${PARTIAL_REGISTER_POLICY:-degraded}"
      WARP_CONNECT_TIMEOUT: "${WARP_CONNECT_TIMEOUT:-45}"
      BOOT_HEALTH_WAIT: "${BOOT_HEALTH_WAIT:-120}"
      DEREGISTER_ON_SHUTDOWN: "${DEREGISTER_ON_SHUTDOWN:-0}"
      WARP_LICENSE_KEY: "${WARP_LICENSE_KEY:-}"
      ENABLE_AGGREGATE: "${ENABLE_AGGREGATE:-1}"
      ENABLE_CONTROL: "${ENABLE_CONTROL:-1}"
      ENABLE_HEALTH: "${ENABLE_HEALTH:-1}"
      HEALTH_AUTO_ROTATE: "${HEALTH_AUTO_ROTATE:-0}"
      SEAT_PUSH: "${SEAT_PUSH:-1}"
      SEAT_PUSH_PER_PASS: "${SEAT_PUSH_PER_PASS:-1}"
      REDRAW_MAX: "${REDRAW_MAX:-2}"
      SUPERVISE_EXIT_ON_ALL_DEAD: "${SUPERVISE_EXIT_ON_ALL_DEAD:-0}"
      WEB_ROOT: "${WEB_ROOT:-/opt/warp-pool/web}"
      LOCK_STALE_SEC: "${LOCK_STALE_SEC:-300}"
    volumes:
      - warp-pool-data:/data
    ports:
      - "127.0.0.1:${HOST_AGG_PORT:-19080}:1080"
      - "127.0.0.1:${HOST_CONTROL_PORT:-19090}:9090"
      # expose 默认关；需要直连时设 ENABLE_EXPOSE=1 并取消下一行注释
      # - "127.0.0.1:${HOST_EXPOSE_BASE:-19100}-19102:11000-11002"
    networks:
      - default
      - cpa_default
    # N=5 × ~110MiB warp-svc needs >512m; default 1536m
    mem_limit: ${MEM_LIMIT:-1536m}

volumes:
  warp-pool-data:
    name: warp-pool-data
    external: true

networks:
  default:
    driver: bridge
  cpa_default:
    name: cpa_default
    external: true
