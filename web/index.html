<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>warppool — Warp+netns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f0f13; color: #e0e0e0; min-height: 100vh; }
    .app { max-width: 680px; margin: 0 auto; padding: 32px 16px; }
    .header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; color: #f0f0f0; letter-spacing: -0.02em; }
    .header .tag { font-size: 0.75rem; color: #888; background: #1a1a24; padding: 2px 10px; border-radius: 999px; }
    .header .refresh { margin-left: auto; background: none; border: 1px solid #333; color: #aaa; font-size: 0.85rem; padding: 4px 14px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .header .refresh:hover { background: #1e1e2a; color: #fff; }
    .card { background: #17171f; border-radius: 14px; overflow: hidden; margin-bottom: 10px; transition: opacity 0.2s; }
    .card-body { padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .card .id { font-weight: 600; font-size: 1.1rem; color: #888; min-width: 32px; }
    .card .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .card .dot.ok { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.4); }
    .card .dot.fail { background: #ef4444; }
    .card .info { flex: 1; min-width: 0; }
    .card .info .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .info .v4 { font-size: 1.1rem; font-weight: 600; color: #22c55e; font-variant-numeric: tabular-nums; }
    .card .info .v6 { font-size: 1.1rem; font-weight: 600; color: #818cf8; font-variant-numeric: tabular-nums; word-break: break-all; }
    .card .info .meta { font-size: 0.8rem; color: #666; margin-top: 2px; }
    .card .rotate-btn { background: none; border: 1px solid #333; color: #aaa; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
    .card .rotate-btn:hover { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.08); }
    .card .rotate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .agg { margin-top: 20px; padding: 14px 20px; background: #17171f; border-radius: 14px; display: flex; align-items: center; gap: 12px; }
    .agg .label { font-size: 0.8rem; color: #666; }
    .agg .port { font-size: 1.1rem; font-weight: 600; color: #f0f0f0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e1e2a; color: #ccc; padding: 10px 24px; border-radius: 10px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>warppool</h1>
      <span class="tag">v0.3</span>
      <button class="refresh" onclick="refresh()">&#x21bb; 刷新</button>
    </div>

    <div id="list"></div>
    <div class="agg">
      <span class="label">聚合</span>
      <span class="port">:1080</span>
      <span style="flex:1"></span>
      <span class="label" id="agg-status">健康 0/0</span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const TOKEN = new URLSearchParams(location.search).get('token') || '';
    const q = (s) => (s ? '?' + s : '');

    async function load() {
      try {
        const res = await fetch('/instances' + q(TOKEN ? 'token=' + TOKEN : ''), { cache: 'no-store' });
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('list').innerHTML = '<div style="color:#666;text-align:center;padding:40px">连接失败，检查容器是否运行</div>';
      }
    }

    function render(instances) {
      const list = document.getElementById('list');
      list.innerHTML = '';

      let ok = 0;
      instances.forEach(inst => {
        if (inst.healthy) ok++;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-body">
            <div class="id">${inst.id}</div>
            <div class="dot ${inst.healthy ? 'ok' : 'fail'}"></div>
            <div class="info">
              <div class="v4">${inst.v4 || '—'}</div>
              <div class="meta">expose :${inst.expose || '?'}</div>
            </div>
            <button class="rotate-btn" onclick="rotate(${inst.id})" id="rot-${inst.id}">重启</button>
          </div>
        `;
        list.appendChild(card);
      });
      document.getElementById('agg-status').textContent = `健康 ${ok}/${instances.length}`;
    }

    async function rotate(id) {
      const btn = document.getElementById('rot-' + id);
      btn.disabled = true;
      btn.textContent = '旋转中…';
      try {
        await fetch('/rotate?id=' + id + '&mode=restart' + (TOKEN ? '&token=' + TOKEN : ''), { method: 'POST' });
        showToast('实例 ' + id + ' 已重启');
      } catch (e) {
        showToast('重启失败');
      }
      setTimeout(() => { load(); }, 1000);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function refresh() {
      load();
    }

    setInterval(load, 5000);
    load();
  </script>
</body>
</html>
