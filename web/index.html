<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>warppool — Warp+netns</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; font-family: system-ui, sans-serif; }
    .instance { cursor: pointer; }
    .v4 { color: #10b981; }
    .v6 { color: #6366f1; }
    .rotate-btn { font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>warppool <small class="text-muted">Warp+netns v0.3</small></h1>
    <p class="text-muted">单容器多出口 • rotate=实例重启 • IPv4 互异</p>

    <button onclick="refresh()" class="btn btn-sm btn-outline-secondary mb-3">刷新</button>

    <table id="instances" class="table table-hover table-striped align-middle">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>健康</th>
          <th>v4</th>
          <th>v6</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="mt-4 text-muted small">
      聚合 :1080 • 控制 /ui/ • <a href="https://github.com/mcheiyue/warp-pool" target="_blank">源码</a>
    </div>
  </div>

  <script>
    let pollInterval = 4000;
    let lastData = null;

    async function load() {
      try {
        const res = await fetch('/instances', { cache: 'no-store' });
        const data = await res.json();
        renderTable(data);
        lastData = data;
      } catch (e) {
        console.error(e);
      }
    }

    function renderTable(instances) {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      instances.forEach(inst => {
        const row = document.createElement('tr');
        row.className = 'instance';
        row.innerHTML = `
          <td><strong>${inst.id}</strong></td>
          <td><span class="${inst.healthy ? 'text-success' : 'text-danger'}">${inst.healthy ? '✓' : '✗'}</span></td>
          <td class="v4">${inst.v4 || '—'}</td>
          <td class="v6">${inst.v6 || '—'}</td>
          <td>
            <button onclick="event.stopPropagation(); rotate(${inst.id});" 
                    class="btn btn-sm btn-outline-primary rotate-btn">重启</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function rotate(id) {
      const token = new URLSearchParams(location.search).get('token') || '';
      await fetch(`/rotate?id=${id}&mode=restart${token ? `&token=${token}` : ''}`, { method: 'POST' });
      load();
    }

    async function refresh() {
      load();
    }

    // poll
    setInterval(() => {
      load();
    }, pollInterval);

    // initial
    load();
  </script>
</body>
</html>
