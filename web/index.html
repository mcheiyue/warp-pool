<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>warppool</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f0f13; color: #e0e0e0; min-height: 100vh; }
    .app { max-width: 680px; margin: 0 auto; padding: 32px 16px; }
    .header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .header h1 { font-size: 1.6rem; font-weight: 700; color: #f0f0f0; letter-spacing: -0.02em; }
    .header .tag { font-size: 0.75rem; color: #888; background: #1a1a24; padding: 2px 10px; border-radius: 999px; }
    .header .refresh { margin-left: auto; background: none; border: 1px solid #333; color: #aaa; font-size: 0.85rem; padding: 4px 14px; border-radius: 8px; cursor: pointer; }
    .header .refresh:hover { background: #1e1e2a; color: #fff; }
    .card { background: #17171f; border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
    .card-body { padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .card .id { font-weight: 600; font-size: 1.1rem; color: #888; min-width: 32px; }
    .card .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .card .dot.ok { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.4); }
    .card .dot.fail { background: #ef4444; }
    .card .info { flex: 1; min-width: 0; }
    .card .info .v4 { font-size: 1.1rem; font-weight: 600; color: #22c55e; font-variant-numeric: tabular-nums; }
    .card .info .meta { font-size: 0.8rem; color: #666; margin-top: 2px; }
    .card .rotate-btn { background: none; border: 1px solid #333; color: #aaa; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .card .rotate-btn:hover { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.08); }
    .card .rotate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .agg { margin-top: 20px; padding: 14px 20px; background: #17171f; border-radius: 14px; display: flex; align-items: center; gap: 12px; }
    .agg .label { font-size: 0.8rem; color: #666; }
    .agg .port { font-size: 1.1rem; font-weight: 600; color: #f0f0f0; }
    .msg { text-align: center; padding: 40px 20px; color: #888; }
    .auth { background: #17171f; border-radius: 14px; padding: 24px; margin-bottom: 16px; }
    .auth label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 8px; }
    .auth input { width: 100%; background: #0f0f13; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; }
    .auth button { background: #22c55e; border: none; color: #0f0f13; font-weight: 600; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e1e2a; color: #ccc; padding: 10px 24px; border-radius: 10px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>warppool</h1>
      <span class="tag">v0.3</span>
      <button class="refresh" onclick="load()">↻ 刷新</button>
    </div>
    <div id="auth" class="auth" style="display:none">
      <label>CONTROL_TOKEN（API 需要鉴权）</label>
      <input id="token-input" type="password" placeholder="输入 token" autocomplete="off">
      <button onclick="saveToken()">保存并加载</button>
    </div>
    <div id="list"><div class="msg">加载中…</div></div>
    <div class="agg">
      <span class="label">聚合</span>
      <span class="port">:1080</span>
      <span style="flex:1"></span>
      <span class="label" id="agg-status">—</span>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    function getToken() {
      const q = new URLSearchParams(location.search).get('token');
      if (q) { localStorage.setItem('wp_token', q); return q; }
      return localStorage.getItem('wp_token') || '';
    }
    function authQS() {
      const t = getToken();
      return t ? '?token=' + encodeURIComponent(t) : '';
    }
    function saveToken() {
      const v = document.getElementById('token-input').value.trim();
      if (!v) return;
      localStorage.setItem('wp_token', v);
      const u = new URL(location.href);
      u.searchParams.set('token', v);
      history.replaceState(null, '', u.toString());
      document.getElementById('auth').style.display = 'none';
      load();
    }
    async function load() {
      const list = document.getElementById('list');
      try {
        const res = await fetch('/instances' + authQS(), { cache: 'no-store' });
        if (res.status === 401) {
          document.getElementById('auth').style.display = 'block';
          list.innerHTML = '<div class="msg">需要 token 才能读取实例。请在上方输入 CONTROL_TOKEN。</div>';
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        document.getElementById('auth').style.display = 'none';
        render(Array.isArray(data) ? data : []);
      } catch (e) {
        list.innerHTML = '<div class="msg">连接失败：' + e.message + '<br><small>确认隧道指向 19090，且容器在跑</small></div>';
      }
    }
    function render(instances) {
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (!instances.length) {
        list.innerHTML = '<div class="msg">暂无实例（启动中或尚未写入 meta）</div>';
        document.getElementById('agg-status').textContent = '健康 0/0';
        return;
      }
      let ok = 0;
      instances.forEach(inst => {
        if (inst.healthy) ok++;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="card-body">' +
            '<div class="id">' + inst.id + '</div>' +
            '<div class="dot ' + (inst.healthy ? 'ok' : 'fail') + '"></div>' +
            '<div class="info">' +
              '<div class="v4">' + (inst.v4 || inst.ip || '—') + '</div>' +
              '<div class="meta">expose :' + (inst.expose || '?') + ' · ' + (inst.mode || 'warp') + '</div>' +
            '</div>' +
            '<button class="rotate-btn" id="rot-' + inst.id + '" onclick="rotate(' + inst.id + ')">重启</button>' +
          '</div>';
        list.appendChild(card);
      });
      document.getElementById('agg-status').textContent = '健康 ' + ok + '/' + instances.length;
    }
    async function rotate(id) {
      const btn = document.getElementById('rot-' + id);
      if (btn) { btn.disabled = true; btn.textContent = '旋转中…'; }
      try {
        const res = await fetch('/rotate?id=' + id + '&mode=restart' + (getToken() ? '&token=' + encodeURIComponent(getToken()) : ''), { method: 'POST' });
        const j = await res.json().catch(() => ({}));
        showToast(res.ok && j.ok !== false ? ('实例 ' + id + ' 已重启') : ('失败: ' + (j.error || res.status)));
      } catch (e) {
        showToast('重启失败: ' + e.message);
      }
      setTimeout(load, 1500);
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
    setInterval(load, 5000);
    load();
  </script>
</body>
</html>
